name: packages

on:
  push:
    branches:
      - stable
  pull_request:
    paths:
      - "packages/simplex-chat-nodejs/**"
      - "packages/simplex-chat-client/types/typescript/**"
      - "packages/simplex-chat-python/**"
      - ".github/workflows/packages.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # build.yml and this workflow both run for a pull request that changes the core and the packages
  group: ${{ github.workflow }}-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_SCOPE: ${{ vars.NPM_SCOPE }}
  PYPI_PROJECT: ${{ vars.PYPI_PROJECT }}
  PYPI_URL: ${{ vars.PYPI_URL }}

jobs:
  typescript-client:
    name: TypeScript client checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build local TypeScript API types
        working-directory: packages/simplex-chat-client/types/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build

      - name: Lint WebSocket client
        working-directory: packages/simplex-chat-client/typescript
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund ../types/typescript
          npm run eslint

      - name: Check TypeScript client
        working-directory: packages/simplex-chat-nodejs
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false ../simplex-chat-client/types/typescript
          npx --no-install tsc --noEmit

      - name: Test TypeScript client
        working-directory: packages/simplex-chat-nodejs
        run: |
          # ZIP extraction tests check the file mode under a standard POSIX umask.
          umask 022
          npm test -- --runInBand --runTestsByPath \
            tests/api.unit.test.ts tests/bot.unit.test.ts tests/commands.test.ts \
            tests/libs.test.ts tests/util.test.ts

  addon:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Build plan
        id: plan
        run: python3 scripts/ci/packages_release.py build-plan --base HEAD^1 >> "$GITHUB_OUTPUT"

  build:
    name: "build ${{ matrix.platform }}"
    needs: addon
    if: needs.addon.outputs.platforms != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.addon.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build simplex-chat (npm) and add-on
        run: scripts/ci/package-tests.sh build ${{ matrix.platform }}

      - name: Test simplex-chat (npm and PyPI)
        run: scripts/ci/package-tests.sh test
